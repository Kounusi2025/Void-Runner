<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="降ってくる赤いブロックをよけて、コインを集めるスマホ・PC対応のブラウザゲーム。">
<title>Void Runner</title>

<!-- シェアしたときに出るプレビュー(OGP)。
     公開後、og:image のURLを「自分のGitHub PagesのURL + /ogp.png」に書き換えてください。 -->
<meta property="og:type" content="website">
<meta property="og:title" content="Void Runner">
<meta property="og:description" content="降ってくるブロックを、ひたすらよけろ。スマホ・PC対応のブラウザゲーム。">
<meta property="og:image" content="https://YOUR-NAME.github.io/void-runner/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Void Runner">
<meta name="twitter:description" content="降ってくるブロックを、ひたすらよけろ。">
<meta name="twitter:image" content="https://YOUR-NAME.github.io/void-runner/ogp.png">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Crect x='8' y='8' width='16' height='16' rx='4' fill='%233df5ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage">
  <canvas id="game"></canvas>

  <!-- ===== HUD(プレイ中の表示) ===== -->
  <div id="levelbar" class="hidden"><div id="levelbar-fill"></div></div>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="hud-score" id="hud-score">0</div>
      <div class="hud-best">BEST <span id="hud-best">0</span></div>
    </div>
    <div class="hud-right">
      <div class="hud-lv">LV <span id="hud-level">1</span></div>
      <div class="hud-coins"><i class="coin-dot"></i><span id="hud-coins">0</span></div>
    </div>
  </div>

  <div id="hud-buttons" class="hidden">
    <button id="btn-pause" class="icon-btn" aria-label="ポーズ">❚❚</button>
    <button id="btn-sound" class="icon-btn" aria-label="サウンドのオン/オフ">♪</button>
  </div>

  <div id="shield-ind">SHIELD</div>

  <div id="combo">
    <div id="combo-pill">
      <span id="combo-text"></span>
      <i id="combo-bar"><b></b></i>
    </div>
  </div>

  <!-- ===== 演出 ===== -->
  <div id="countdown"></div>
  <div id="start-hint"></div>
  <div id="banner"><span id="banner-main"></span><small id="banner-sub"></small></div>
  <div id="flash"></div>

  <!-- ===== タイトル ===== -->
  <section id="screen-title" class="screen show">
    <button id="btn-lite" class="chip" aria-label="軽量モードの切り替え">⚡ LITE OFF</button>
    <h1 class="logo">
      <span class="logo-top">VOID</span>
      <span class="logo-bottom">RUNNER</span>
    </h1>
    <p class="tagline">降ってくるブロックを、ひたすらよけろ。</p>
    <button id="btn-start" class="btn primary">▶ START</button>
    <div id="slot-title" class="slot"></div>
    <div class="best-line">BEST <b id="title-best">0</b> <span class="sep">/</span> PLAY <b id="title-plays">0</b></div>
    <div class="ver">v1.1</div>
  </section>

  <!-- ===== ポーズ ===== -->
  <section id="screen-pause" class="screen">
    <h2 class="screen-title">PAUSE</h2>
    <div id="slot-pause" class="slot"></div>
    <div class="row">
      <button id="btn-resume" class="btn primary">▶ つづける</button>
      <button id="btn-quit" class="btn ghost">タイトルへ</button>
    </div>
  </section>

  <!-- ===== ゲームオーバー ===== -->
  <section id="screen-over" class="screen">
    <h2 class="screen-title over-title">GAME OVER</h2>
    <div id="newrecord" class="badge">★ NEW RECORD ★</div>
    <div class="over-score" id="over-score">0</div>
    <div class="over-rank" id="over-rank">RANK ROOKIE</div>
    <div class="over-best">BEST <b id="over-best">0</b></div>
    <div class="stats">
      <div><span>生存</span><b id="st-time">0.0秒</b></div>
      <div><span>コイン</span><b id="st-coins">0</b></div>
      <div><span>最大コンボ</span><b id="st-combo">0</b></div>
      <div><span>到達レベル</span><b id="st-level">1</b></div>
    </div>
    <div class="share">
      <div class="share-label">SHARE</div>
      <div class="share-row">
        <button id="btn-x" class="sbtn sx" aria-label="Xでポスト">X ポスト</button>
        <button id="btn-line" class="sbtn sl" aria-label="LINEで送る">LINE</button>
        <button id="btn-img" class="sbtn si" aria-label="スコア画像を共有">画像</button>
        <button id="btn-copy" class="sbtn sc" aria-label="テキストをコピー">コピー</button>
      </div>
    </div>
    <div class="row">
      <button id="btn-retry" class="btn primary">↻ もう一度</button>
      <button id="btn-title" class="btn ghost">タイトルへ</button>
    </div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
</div>

<!-- ルール・操作説明(タイトルとポーズ画面で共通に使う) -->
<template id="tpl-howto">
  <div class="howto">
    <div class="card">
      <h3>RULES <small>ルール</small></h3>
      <ul class="rules">
        <li><span class="ico"><i class="ico-block"></i></span><span><b class="red">赤いブロック</b>に当たるとアウト</span></li>
        <li><span class="ico"><i class="ico-coin"></i></span><span><b class="gold">コイン +50点</b> 連続で取るとコンボ!</span></li>
        <li><span class="ico"><i class="ico-shield"></i></span><span><b class="cyan">シールド</b>を取ると1回だけ守ってくれる</span></li>
        <li><span class="ico"><i class="ico-up">▲</i></span><span>15秒ごとに<b class="cyan">レベルUP</b>・加速!</span></li>
      </ul>
    </div>
    <div class="card">
      <h3>CONTROLS <small>操作方法</small></h3>
      <div class="controls">
        <div class="ctrl ctrl-pc">
          <div class="ctrl-name">PC</div>
          <div class="pad">
            <i class="key k-u">↑<small>W</small></i>
            <i class="key k-l">←<small>A</small></i>
            <i class="key k-d">↓<small>S</small></i>
            <i class="key k-r">→<small>D</small></i>
          </div>
          <div class="ctrl-sub">P:ポーズ / M:ミュート</div>
        </div>
        <div class="ctrl ctrl-mobile">
          <div class="ctrl-name">スマホ</div>
          <div class="finger-area"><i class="finger"></i></div>
          <div class="ctrl-sub">画面のどこでも<br>指をスライド</div>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="script.js"></script>
</body>
</html>
